<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3e63"/>
      <stop offset="0.45" stop-color="#8c6a7e"/>
      <stop offset="0.75" stop-color="#e2a977"/>
      <stop offset="1" stop-color="#f6d9a0"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9dcc2"/>
      <stop offset="1" stop-color="#cdb994"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7b3a3a"/>
      <stop offset="1" stop-color="#5a2530"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.8" cy="0.74" r="0.5">
      <stop offset="0" stop-color="#fff2c6" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff2c6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#sun)"/>
  <g fill="#fff" opacity="0.5">
    <circle cx="180" cy="120" r="2"/><circle cx="420" cy="70" r="1.6"/><circle cx="640" cy="160" r="1.8"/>
    <circle cx="920" cy="60" r="2"/><circle cx="1180" cy="130" r="1.6"/><circle cx="1420" cy="80" r="2"/>
  </g>
  <path d="M0 640 C250 560 450 600 700 590 C980 575 1200 520 1600 600 L1600 900 L0 900Z" fill="#7d8a6a"/>
  <path d="M0 700 C300 650 600 690 900 665 C1200 640 1400 670 1600 650 L1600 900 L0 900Z" fill="#5f6f52"/>
  <g transform="translate(360 0)">
    <!-- nave -->
    <rect x="640" y="470" width="470" height="250" fill="url(#stone)"/>
    <path d="M615 475 L875 360 L1135 475 Z" fill="url(#roof)"/>
    <!-- tower -->
    <rect x="460" y="300" width="180" height="420" fill="url(#stone)"/>
    <path d="M440 305 L550 120 L660 305 Z" fill="url(#roof)"/>
    <rect x="546" y="60" width="8" height="70" fill="#3b2a24"/>
    <rect x="528" y="82" width="44" height="8" fill="#3b2a24"/>
    <rect x="505" y="330" width="90" height="120" rx="45" fill="#3b2a24"/>
    <rect x="520" y="345" width="60" height="95" rx="30" fill="#f4c76a" opacity="0.9"/>
    <circle cx="550" cy="520" r="30" fill="#3b2a24"/>
    <circle cx="550" cy="520" r="22" fill="#f4c76a" opacity="0.85"/>
    <!-- nave windows -->
    <g fill="#3b2a24">
      <rect x="690" y="520" width="44" height="110" rx="22"/>
      <rect x="780" y="520" width="44" height="110" rx="22"/>
      <rect x="870" y="520" width="44" height="110" rx="22"/>
      <rect x="960" y="520" width="44" height="110" rx="22"/>
      <rect x="1050" y="520" width="44" height="110" rx="22"/>
    </g>
    <g fill="#f4c76a" opacity="0.9">
      <rect x="696" y="530" width="32" height="92" rx="16"/>
      <rect x="786" y="530" width="32" height="92" rx="16"/>
      <rect x="876" y="530" width="32" height="92" rx="16"/>
      <rect x="966" y="530" width="32" height="92" rx="16"/>
      <rect x="1056" y="530" width="32" height="92" rx="16"/>
    </g>
    <!-- door, steps, path -->
    <rect x="520" y="610" width="60" height="110" rx="30" fill="#4a2f26"/>
    <path d="M470 720 H630 V738 H470Z" fill="#cdb994"/>
    <path d="M600 740 C650 800 500 840 360 900 L760 900 C740 840 650 800 610 740Z" fill="#d9c8a6" opacity="0.8"/>
