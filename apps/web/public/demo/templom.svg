    <g fill="#3f5236">
      <ellipse cx="390" cy="650" rx="60" ry="100"/>
      <ellipse cx="1200" cy="640" rx="70" ry="105"/>
    </g>
    <g fill="#2e3b27">
      <rect x="384" y="730" width="12" height="35"/>
      <rect x="1194" y="725" width="12" height="35"/>
    </g>
